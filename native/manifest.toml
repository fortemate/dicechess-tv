schema-version = 1

[package]
title = "Dice Chess TV"
version = "0.1.0"
id = "com.fortemate.dicechesstv"
# 512x512 PNG under assets/image, generated by scripts/generate-assets.mjs from
# brand/. One field serves two places: Settings, which is dark, and the launcher,
# which fits it into a WIDE tile — hence the brand's maskable export rather than
# a bare mark, which came out distorted on the home screen.
icon = "@image/icon.png"

[os.version]
min = "1.2"
target = "1.2"

# Only what the app actually uses. The runtime rejects a malformed manifest as a
# whole, so edit a [[needs.module]] block by removing all of its lines, never
# just its id.
[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

# The pieces are drawn with @amazon-devices/react-native-svg, which is deployed
# by the system rather than built from source.
[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

# Sound. @amazon-devices/react-native-w3cmedia is the one playback route that
# worked on the device; see "Sound" in README.md.
[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"



[components]
[[components.interactive]]
id = "com.fortemate.dicechesstv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
