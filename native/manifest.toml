schema-version = 1

[package]
title = "Dice Chess TV"
version = "0.1.0"
id = "com.fortemate.dicechesstv"
# 512x512 PNG under assets/image, generated by scripts/generate-assets.mjs from
# brand/. One field serves two places: Settings, which is dark, and the launcher,
# which fits it into a WIDE tile — hence the brand's maskable export rather than
# a bare mark, which came out distorted on the home screen.
icon = "@image/icon.png"

[os.version]
min = "1.2"
target = "1.2"

# Only what the app actually uses. The runtime rejects a malformed manifest as a
# whole, so edit a [[needs.module]] block by removing all of its lines, never
# just its id.
[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

# The pieces are drawn with @amazon-devices/react-native-svg, which is deployed
# by the system rather than built from source.
[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

# Sound. @amazon-devices/react-native-w3cmedia is the one playback route that
# worked on the device; see "Sound" in README.md.
[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"



# System services the app connects to. Vega's service manager refuses any
# connection a manifest did not declare, and says so only in the device log:
# "missing permission for connection attempt".
[wants]

# Sound. Without these the media player cannot reach the audio server, and every
# cue fails silently at the sink. This was measured: undeclared, 13 connections
# to com.amazon.audio.stream were refused during one probe run; declared, none
# were and the audio server opened a playback stream. The set is the one Amazon's
# own audio sample declares.
[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediametrics.service"

# Not in Amazon's audio sample, but refused to this app at start-up until it was
# declared: the player's audio-focus client connects to it.
[[wants.service]]
id = "com.amazon.audio.control"

# Deliberately NOT declared: com.amazon.inputd.service. Amazon's React Native TV
# guidance (written for SDK 0.22) says useTVEventHandler receives nothing without
# it. On SDK 0.24 the opposite holds for this app: the remote works without it,
# and declaring it makes the process exit with code 255 at start-up, right after
# "Inputd-client: requestPriority ... WRITE_TO_UDEV". Measured by adding and
# removing that one entry on the virtual device. Check again on the Stick.

[components]
[[components.interactive]]
id = "com.fortemate.dicechesstv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
