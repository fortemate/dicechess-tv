schema-version = 1

[package]
title = "Dice Chess TV"
version = "0.1.0"
id = "com.fortemate.dicechesstv"

[os.version]
min = "1.2"
target = "1.2"

# Only what the app actually uses. The runtime rejects a malformed manifest as a
# whole, so edit a [[needs.module]] block by removing all of its lines, never
# just its id.
[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

# The pieces are drawn with @amazon-devices/react-native-svg, which is deployed
# by the system rather than built from source.
[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[components]
[[components.interactive]]
id = "com.fortemate.dicechesstv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
