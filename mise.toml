[tools]
# --- Runtime ---
node = "26.8.2" # both packages build and test with the version CI uses

# --- Git hooks (lefthook.yml) ---
lefthook = "2.1.14" # Git hooks manager (pre-commit / pre-push)
betterleaks = "1.8.1" # secret scanning in the pre-commit hook
actionlint = "1.7.12" # workflow linting in the pre-commit hook

# The Vega SDK is not a mise tool: Amazon licenses it to each developer, who
# installs it with Amazon's installer. The `build` and `device:*` tasks need its
# `vega` CLI on the PATH.

# --- Setup ---

[tasks.setup]
description = "📦 Install both packages' dependencies and register the Git hooks"
run = ["npm ci", "npm ci --prefix native", "lefthook install"]

[tasks."hook:install"]
description = "🪝 Register the Git hooks (lefthook)"
run = "lefthook install"

[tasks."hook:run"]
description = "🏃 Run every pre-commit job over the whole repository, not only staged files"
run = "lefthook run pre-commit --all-files"

# --- Checks: the same as CI ---

[tasks.check]
description = "✅ Run every check CI runs, in both packages: types, lint, format and tests"
run = [
  "npm run check",
  "npm run lint",
  "npm run format:check",
  "npm test",
  "npm run check --prefix native",
  "npm run lint --prefix native",
  "npm test --prefix native",
]

[tasks.test]
description = "🧪 Run both packages' tests"
run = ["npm test", "npm test --prefix native"]

[tasks.lint]
description = "🔍 Lint both packages (the application with Amazon's Vega rules)"
run = ["npm run lint", "npm run lint --prefix native"]

[tasks.format]
description = "🎨 Format the repository with Prettier"
run = "npm run format"

[tasks.coverage]
description = "📊 Run both packages' tests with coverage, written as LCOV to coverage/"
run = "npm run coverage"

# --- The application on a Vega Virtual Device (needs the Vega SDK) ---

[tasks.build]
description = "🔨 Build the installable package (native/build/aarch64-release/), numbered as the latest beta"
# A device refuses a build numbered lower than the one installed, so a plain local
# build (number 0) will not install over a beta. This one takes the latest beta's
# number from the tags, on GitHub or, offline, in the clone: it installs over that
# beta, and the next beta, numbered higher, installs over it. BUILD_NUMBER overrides.
run = '''
n="${BUILD_NUMBER:-$( { git ls-remote --tags origin 'v*-beta.*' 2>/dev/null || git show-ref --tags; } | sed -nE 's#.*refs/tags/v[^[:space:]]*-beta\.([0-9]+)$#\1#p' | sort -n | tail -1)}"
echo "build number ${n:-0}"
npm run build --prefix native -- --build-number "${n:-0}"
'''

[tasks.portraits]
description = "🖼️  Vendor the characters' portraits from dicechess-assets into git-ignored native/portraits/"
# The portraits stay out of git while this repository is public (#212), so a local
# build vendors them. This takes the newest pack on the asset repository's main
# branch whose version is the PORTRAITS_VERSION the app loads (a pack of another
# version would ship and never load). ASSETS_DIR names the dicechess-assets
# checkout (default: next to this one); PORTRAITS_COMMIT pins another commit.
run = '''
dir="${ASSETS_DIR:-../dicechess-assets}"
pack=portraits/dicechess-cast/manifest.json
want="$(sed -nE "s/^export const PORTRAITS_VERSION = '([^']+)';.*/\1/p" native/src/Portrait.tsx)"
commit="${PORTRAITS_COMMIT:+$(git -C "$dir" rev-parse "$PORTRAITS_COMMIT")}"
if [ -z "$commit" ]; then
  git -C "$dir" fetch --quiet origin
  for c in $(git -C "$dir" rev-list origin/main -- "$pack"); do
    v="$(git -C "$dir" show "$c:$pack" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
    if [ "$v" = "$want" ]; then commit="$c"; break; fi
  done
fi
if [ -z "$commit" ]; then
  echo "no portraits pack $want on the main branch of $dir" >&2
  exit 1
fi
echo "portraits $want from $commit"
node native/scripts/vendor-portraits.mjs "$dir" "$commit"
'''

[tasks."device:start"]
description = "📺 Start the Vega Virtual Device"
run = "vega virtual-device start"

[tasks."device:stop"]
description = "⏹️  Stop the Vega Virtual Device"
run = "vega virtual-device stop"

[tasks."device:install"]
description = "📥 Install the built package on the virtual device"
run = "vega device install-app -d VirtualDevice -p native/build/aarch64-release/dicechess-tv-native_aarch64.vpkg"

[tasks."device:launch"]
description = "▶️  Launch the application on the virtual device"
run = "vega device launch-app -d VirtualDevice -a com.fortemate.dicechesstv.main"

[tasks."device:run"]
description = "🚀 Build, install and launch on the virtual device"
depends = ["build"]
run = [
  "vega device install-app -d VirtualDevice -p native/build/aarch64-release/dicechess-tv-native_aarch64.vpkg",
  "vega device launch-app -d VirtualDevice -a com.fortemate.dicechesstv.main",
]
