name: 'CD: Deploy Site'

# The project site in site/. It is built on every pull request that touches it,
# so a broken page fails before the merge, and built and deployed to a
# Cloudflare Worker (site/wrangler.jsonc) on a push to main. Its logo and favicon are the app icon, read from
# native/icon/, so a new icon rebuilds it too.
#
# The browser test bench in web/ is deployed with it, under /bench/: it draws
# the game's screens from native/src/ and src/core/ with the engine of the
# root install and the vendored sounds, so a change to any of those redeploys
# it. Like the tester pages it is unlisted (web/README.md).
on:
  pull_request:
    paths:
      - 'site/**'
      - 'native/icon/icon-512.png'
      - 'web/**'
      - 'native/src/**'
      - 'native/sounds/**'
      - 'src/core/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yaml'
      - 'site/wrangler.jsonc'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'native/icon/icon-512.png'
      - 'web/**'
      - 'native/src/**'
      - 'native/sounds/**'
      - 'src/core/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yaml'
      - 'site/wrangler.jsonc'
  workflow_dispatch:

permissions: {}

# One run per branch at a time. A newer pull-request run replaces an older one.
# On main a deployment is never cancelled halfway; the newest waiting run
# follows it.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    # A GitHub-hosted runner, named here rather than taken from vars.RUNS_ON.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so that each page's "Last updated" date is the
          # date of its own last commit, not of the commit being built.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # engines.node in site/package.json: the root's range, which the
          # version in mise.toml satisfies.
          node-version-file: site/package.json
          # No dependency cache. The install takes seconds, and a run that
          # deploys should not restore files an earlier run left behind.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site
        env:
          # Where the tester pages send their answers: the owner's answers
          # sheet (site/answers-sheet/README.md). A web-app URL, not a secret:
          # every visitor's browser reads it from the page. Without it the
          # pages send nothing.
          PUBLIC_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}

      # The bench: its own package, with the engine from the root install, as
      # the core imports it. Its build uses relative paths, so it is copied into
      # the site's output as it is.
      - name: Install the bench's dependencies
        run: npm ci && npm ci --prefix web

      - name: Build the bench
        run: npm run build --prefix web

      - name: Add the bench to the site
        run: cp -R web/dist site/dist/bench

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist
          if-no-files-found: error
          retention-days: 1

  # The deployment holds the Cloudflare token, so it runs apart from the build
  # and sees nothing but the built site and the Worker's configuration.
  deploy:
    name: Deploy to Cloudflare
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the Worker's configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: site/wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download the site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/dist

      # An API token limited to editing Workers scripts, and the account it
      # belongs to: repository secrets, so neither is written in the repository.
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: '4.147.0'
          command: deploy
