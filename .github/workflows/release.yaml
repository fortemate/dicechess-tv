# Ops: Release
#
# Cuts a tag, builds the installable package and publishes a release with it
# attached. Dispatch only: releases are an owner action, never an agent's and
# never automatic on a push.
#
# It must run on the self-hosted runner, because that is the only machine with
# the Vega SDK. The cost of that is real and worth stating: while aurora is
# offline no release can be cut here, and the fallback is to build on a
# developer machine and attach the package by hand.
#
# The version is read from `native/manifest.toml` rather than computed from the
# last tag. That file is what the device installs and what the store would see,
# so it is the one true version; a release whose tag disagreed with the package
# it contains would be worse than no release. Bump the manifest in a normal pull
# request, then dispatch this.
name: 'Ops: Release'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: Put the Vega SDK on the PATH
        run: echo "$HOME/vega/bin" >> "$GITHUB_PATH"

      - name: Read the package version
        id: version
        run: |
          set -euo pipefail
          # `[package]` holds `version = "x.y.z"` at the start of a line;
          # `[os.version]` holds `min`/`target`, so this cannot match it.
          version=$(grep -m1 '^version = ' native/manifest.toml | sed 's/.*"\(.*\)".*/\1/')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "native/manifest.toml has no usable version (read: '$version')" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Refuse to reuse a tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — bump the version in native/manifest.toml first." >&2
            exit 1
          fi

      # A release is built from a tree that was checked here, not from one that
      # was checked at some earlier point on some other branch.
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run check --prefix native
      - run: npm test --prefix native

      - name: Build the package
        run: npm run build --prefix native

      - name: Create the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      # Only aarch64 is attached. armv7 and x86_64 are built alongside it, but a
      # Fire TV Stick and the virtual device both take aarch64, and offering a
      # reviewer three files to choose between helps nobody.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            native/build/aarch64-release/dicechess-tv-native_aarch64.vpkg
