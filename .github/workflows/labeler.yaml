name: PR Labeler

# pull_request_target, so that a pull request from a fork can be labelled: the
# workflow and .github/labeler.yml come from the base branch, and no code from
# the pull request is checked out or run. The token can write to pull requests,
# so the action is pinned to a commit and the job runs on a GitHub-hosted image,
# never on the organization's self-hosted runner.
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
