name: Prototype checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run build:vega-web

  native-board:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # The native package imports the shared core, which imports the engine from
      # the root install, so both installs are needed.
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run check --prefix native
      - run: npm test --prefix native
      # Bundling needs no Vega SDK, so it runs here, and it catches what tsc
      # cannot: a Metro configuration that no longer reaches the shared core
      # outside this directory. Removing `watchFolders` fails exactly here.
      - run: npx react-native bundle --entry-file index.js --platform kepler --dev false --bundle-output "${RUNNER_TEMP}/bundle.js"
        working-directory: native
