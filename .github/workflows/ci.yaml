name: Prototype checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
