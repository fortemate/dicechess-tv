name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# This is a private repository, so GitHub-hosted minutes are billed. The checks
# therefore run on the organization's self-hosted runner through `vars.RUNS_ON`,
# falling back to a hosted runner when that variable is unset so a fork or a
# fresh clone still works.
#
# Dependabot is deliberately kept on a hosted runner: its pull requests propose
# code we have not reviewed, and the self-hosted machine holds the Vega SDK and
# the owner's environment.
#
# If aurora is offline a job queues rather than failing, which is quiet — check
# `systemctl --user status actions-runner` on the host before assuming CI is
# merely slow.
jobs:
  # The shared core, checked on its own. `check` runs tsc twice: once over the
  # core and its tests, and once over the core alone with no ambient types, so a
  # DOM or Node global there is a build failure rather than a review comment.
  core:
    runs-on: ${{ fromJSON(github.actor == 'dependabot[bot]' && '["ubuntu-24.04"]' || vars.RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test

  native-board:
    runs-on: ${{ fromJSON(github.actor == 'dependabot[bot]' && '["ubuntu-24.04"]' || vars.RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # The native package imports the shared core, which imports the engine from
      # the root install, so both installs are needed.
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run check --prefix native
      - run: npm test --prefix native
      # Bundling needs no Vega SDK, so it runs even on a hosted runner, and it
      # catches what tsc cannot: a Metro configuration that no longer reaches the
      # shared core outside this directory. Removing `watchFolders` fails here.
      - run: npx react-native bundle --entry-file index.js --platform kepler --dev false --bundle-output "${RUNNER_TEMP}/bundle.js"
        working-directory: native

  # Builds the installable package. Only the self-hosted runner has the Vega SDK,
  # so this job is skipped when `RUNS_ON` is unset — a skipped job is honest, a
  # failing one would train everyone to ignore red.
  #
  # It is also skipped when Dependabot itself triggers the run, because that would
  # install versions nobody has reviewed on the machine that holds the SDK. That
  # skip is exactly how a react-native bump reached main green and unbuildable:
  # the one job able to catch it never ran. So the condition reads the TRIGGERING
  # actor, not the original one. After reading a Dependabot diff, the owner can
  # "Re-run all jobs"; the owner then triggers the run and the real build happens
  # on the self-hosted runner before the merge, not after it.
  #
  # What it adds over `native-board`: the bundle step proves the JavaScript
  # resolves, and nothing more. Only a real build reads `manifest.toml`, runs ABI
  # validation and links the native libraries, so only this job can fail on a
  # broken manifest or a module the device will not provide.
  package:
    if: github.triggering_actor != 'dependabot[bot]' && vars.RUNS_ON != ''
    runs-on: ${{ fromJSON(vars.RUNS_ON) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # The SDK puts itself on the PATH through the shell profile, which a
      # workflow step does not read.
      - name: Put the Vega SDK on the PATH
        run: |
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"
      - name: Record the toolchain
        run: |
          vega --version
          node --version
          npm --version
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run build --prefix native
      # The package is NOT uploaded as an artifact. It was, and the job failed
      # with "Artifact storage quota has been hit" — on this plan the Actions
      # and Packages stores are shared, and the container images in ghcr have
      # filled it. Live artifacts across the organization come to about 19 MB,
      # so deleting those would not help.
      #
      # Nothing is lost: a build that produced the package is what this job is
      # for, and the release workflow attaches the real thing where it belongs.
      # Restore the upload if that storage is ever freed.
      - name: Confirm the package exists
        run: |
          set -euo pipefail
          package=native/build/aarch64-release/dicechess-tv-native_aarch64.vpkg
          test -s "$package"
          echo "Built $(basename "$package"), $(stat -c %s "$package") bytes"
