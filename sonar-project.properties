# ==============================================================================
# SonarQube Cloud project configuration
# ==============================================================================
# Analysed from CI, by the `sonar` job in .github/workflows/ci.yaml, so that the
# analysis receives test coverage. Automatic Analysis must stay off in SonarQube
# Cloud: the two cannot run side by side.

sonar.organization=fortemate
sonar.projectKey=fortemate_dicechess-tv
sonar.projectName=dicechess-tv

# The shared core, the Vega application and its build scripts; their tests.
sonar.sources=src,native/src,native/scripts
sonar.tests=test,native/test
sonar.sourceEncoding=UTF-8

# Generated from the RhosGFX sources and the sound lock, or third-party
# artwork: not code anyone writes by hand.
sonar.exclusions=native/src/pieces/**,native/src/cueFiles.ts,src/assets/**

# Build scripts run on the developer's machine, not on the device.
sonar.coverage.exclusions=native/scripts/**

# The Hot Seat hosts' lines: text copied word for word from the asset
# repository's catalogues, one list per event for every host, so the hosts'
# tables share their shape by design and differ only in their strings.
sonar.cpd.exclusions=src/core/hostScripts.ts

# Written by `npm run coverage`, with paths relative to the repository root:
# the core's report, and one for each test file of the application, which
# SonarQube adds up (scripts/coverage-native.ts says why). test/sonar.test.ts
# fails when a test file is added or removed and this list is not.
sonar.javascript.lcov.reportPaths=coverage/core.lcov,\
  coverage/native/about.lcov,\
  coverage/native/activity.lcov,\
  coverage/native/assets.lcov,\
  coverage/native/board.lcov,\
  coverage/native/boardMotion.lcov,\
  coverage/native/botPacing.lcov,\
  coverage/native/dice.lcov,\
  coverage/native/diceRoll.lcov,\
  coverage/native/firstFrame.lcov,\
  coverage/native/hints.lcov,\
  coverage/native/hostSetting.lcov,\
  coverage/native/input.lcov,\
  coverage/native/layout.lcov,\
  coverage/native/ledger.lcov,\
  coverage/native/lifecycle.lcov,\
  coverage/native/matchup.lcov,\
  coverage/native/modeLine.lcov,\
  coverage/native/music.lcov,\
  coverage/native/musicApp.lcov,\
  coverage/native/noMove.lcov,\
  coverage/native/notices.lcov,\
  coverage/native/opponents.lcov,\
  coverage/native/persistence.lcov,\
  coverage/native/playableDice.lcov,\
  coverage/native/prompt.lcov,\
  coverage/native/randomSource.lcov,\
  coverage/native/recovery.lcov,\
  coverage/native/remoteInput.lcov,\
  coverage/native/renders.lcov,\
  coverage/native/result.lcov,\
  coverage/native/rulesScreen.lcov,\
  coverage/native/screen.lcov,\
  coverage/native/sound.lcov,\
  coverage/native/soundApp.lcov,\
  coverage/native/speechBubble.lcov,\
  coverage/native/splash.lcov,\
  coverage/native/turnSetting.lcov,\
  coverage/native/tutorial.lcov,\
  coverage/native/tutorialOffer.lcov,\
  coverage/native/typography.lcov,\
  coverage/native/useBotVoice.lcov,\
  coverage/native/useDanger.lcov,\
  coverage/native/useHostVoice.lcov,\
  coverage/native/useTutorialVoice.lcov,\
  coverage/native/vendoredMusic.lcov,\
  coverage/native/vendoredSounds.lcov,\
  coverage/native/vendoredVoices.lcov,\
  coverage/native/voiceSetting.lcov

# Findings reviewed and accepted, each with its reason. Kept here rather than
# marked in the SonarQube Cloud interface, so the reasoning is reviewed like code.
sonar.issue.ignore.multicriteria=path,soundTake,diceFallback
# The build scripts run git and npx found on the developer's PATH, by design;
# they never run on the device.
sonar.issue.ignore.multicriteria.path.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=native/scripts/**
# Math.random picks which recording of a cue plays; nothing depends on that
# being unpredictable.
sonar.issue.ignore.multicriteria.soundTake.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.soundTake.resourceKey=native/src/sound.ts
# Vega offers no crypto.getRandomValues, so the dice fall back to Math.random,
# and the source is named. The owner accepted that for a local game; see "Dice"
# in native/README.md.
sonar.issue.ignore.multicriteria.diceFallback.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.diceFallback.resourceKey=native/src/randomSource.ts
