# ==============================================================================
# SonarQube Cloud project configuration
# ==============================================================================
# Analysed from CI, by the `sonar` job in .github/workflows/ci.yaml, so that the
# analysis receives test coverage. Automatic Analysis must stay off in SonarQube
# Cloud: the two cannot run side by side.

sonar.organization=fortemate
sonar.projectKey=fortemate_dicechess-tv
sonar.projectName=dicechess-tv

# The shared core, the Vega application and its build scripts; their tests.
sonar.sources=src,native/src,native/scripts
sonar.tests=test,native/test
sonar.sourceEncoding=UTF-8

# Generated from the RhosGFX sources and the sound lock, or third-party
# artwork: not code anyone writes by hand.
sonar.exclusions=native/src/pieces/**,native/src/cueFiles.ts,src/assets/**

# Build scripts run on the developer's machine, not on the device.
sonar.coverage.exclusions=native/scripts/**

# Written by `npm run coverage`, with paths relative to the repository root.
sonar.javascript.lcov.reportPaths=coverage/core.lcov,coverage/native.lcov

# Findings reviewed and accepted, each with its reason. Kept here rather than
# marked in the SonarQube Cloud interface, so the reasoning is reviewed like code.
sonar.issue.ignore.multicriteria=path,soundTake,diceFallback
# The build scripts run git and npx found on the developer's PATH, by design;
# they never run on the device.
sonar.issue.ignore.multicriteria.path.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=native/scripts/**
# Math.random picks which recording of a cue plays; nothing depends on that
# being unpredictable.
sonar.issue.ignore.multicriteria.soundTake.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.soundTake.resourceKey=native/src/sound.ts
# Vega offers no crypto.getRandomValues, so the dice fall back to Math.random,
# and the source is named. The owner accepted that for a local game; see "Dice"
# in native/README.md.
sonar.issue.ignore.multicriteria.diceFallback.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.diceFallback.resourceKey=native/src/randomSource.ts
